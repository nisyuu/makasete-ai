steps:
  # 1. Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/makasete-ai-repo/makasete-ai:latest', '.']

  # 2. Push Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/makasete-ai-repo/makasete-ai:latest']

  # 3. Deploy to Cloud Run (Specific Service Only)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -z "${_SERVICE_NAME}" ]; then
          echo "Error: _SERVICE_NAME must be specified."
          exit 1
        fi
        
        echo "Deploying ONLY to ${_SERVICE_NAME}..."
        gcloud run deploy "${_SERVICE_NAME}" --image "asia-northeast1-docker.pkg.dev/$PROJECT_ID/makasete-ai-repo/makasete-ai:latest" --region asia-northeast1 --platform managed --quiet

substitutions:
  _SERVICE_NAME: ""

options:
  logging: CLOUD_LOGGING_ONLY
