version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 20
    ignore:
      # typescript-eslint が TS 7 に対応するまでは lint が動かないため、メジャー更新を止める
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
