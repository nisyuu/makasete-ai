name: Create Release Pull Request

on:
  workflow_dispatch:

jobs:
  create_release_pull_request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check and Create Release Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: 'Asia/Tokyo'
        run: |
          gh pr create \
            -B main \
            -H develop \
            -t "$(date +'%Y/%m/%d')リリースPR" \
            -a "${{ github.actor }}" \
            -b ""
