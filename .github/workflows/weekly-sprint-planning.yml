name: Weekly Sprint Planning

on:
  schedule:
    # Every Monday at 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  create_sprint_issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get last week's release info
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_PR=$(gh pr list \
            --base main \
            --head develop \
            --state merged \
            --limit 1 \
            --json number,title,createdAt \
            --jq '.[0] | if . == null then "（前週リリースなし）" else "\(.number): \(.title)" end')

          # Use date-only format (YYYY-MM-DD) required by GitHub search API
          WEEK_AGO=$(date -u -d '7 days ago' +'%Y-%m-%d' 2>/dev/null || date -u -v-7d +'%Y-%m-%d')
          MERGED_PRS=$(gh pr list \
            --base develop \
            --state merged \
            --search "merged:>=$WEEK_AGO" \
            --json number,title \
            --jq '.[] | "- #\(.number): \(.title)"' || echo "（先週マージされたPRなし）")

          DELIMITER="EOF_$(uuidgen | tr -d '-')"
          {
            echo "last_pr<<$DELIMITER"
            echo "$LAST_PR"
            echo "$DELIMITER"
            echo "merged_prs<<$DELIMITER"
            echo "$MERGED_PRS"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Get open feature requests
        id: open_issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_FEATURES=$(gh issue list \
            --label "enhancement" \
            --label "feature" \
            --state open \
            --limit 5 \
            --json number,title,labels \
            --jq '.[] | "- #\(.number): \(.title)"' || echo "（対象Issueなし）")

          DELIMITER="EOF_$(uuidgen | tr -d '-')"
          {
            echo "features<<$DELIMITER"
            echo "$OPEN_FEATURES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create Sprint Planning Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Tokyo
          LAST_PR: ${{ steps.release_info.outputs.last_pr }}
          MERGED_PRS: ${{ steps.release_info.outputs.merged_prs }}
          OPEN_FEATURES: ${{ steps.open_issues.outputs.features }}
        run: |
          WEEK_NUM=$(date +'Week %V')
          SPRINT_TITLE="Sprint Planning - $(date +'%Y/%m/%d') ($WEEK_NUM)"

          {
            echo "## 📋 Sprint Overview"
            echo ""
            echo "**Sprint Goal**: Deliver value through planned feature development and bug fixes"
            echo ""
            echo "### 📊 Previous Week Summary"
            echo ""
            echo "**Last Released**:"
            echo "$LAST_PR"
            echo ""
            echo "**Merged PRs this past week**:"
            echo "$MERGED_PRS"
            echo ""
            echo "### 🎯 Candidates for This Week"
            echo ""
            echo "**Open Feature Requests**:"
            echo "$OPEN_FEATURES"
            echo ""
            echo "### 📝 Planning Tasks"
            echo ""
            echo "- [ ] **Review** previous week's feedback and metrics"
            echo "- [ ] **Select** 3-5 features/fixes for this sprint"
            echo "- [ ] **Assign** tasks to developers"
            echo "- [ ] **Comment** with approved sprint scope: \`@claude plan\`"
            echo ""
            echo "### 💬 Next Steps"
            echo ""
            echo "Once you've finalized the scope, mention \`@claude\` in a comment:"
            echo '```'
            echo "@claude plan"
            echo "Selected features for this sprint:"
            echo "1. Feature A"
            echo "2. Feature B"
            echo "3. Bug fix C"
            echo '```'
            echo ""
            echo "Claude will create detailed implementation plans for each item."
          } > /tmp/issue_body.md

          gh issue create \
            --title "$SPRINT_TITLE" \
            --body-file /tmp/issue_body.md \
            --label "sprint-planning,sprint"
