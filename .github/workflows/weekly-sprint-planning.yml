name: Weekly Sprint Planning

on:
  schedule:
    # Every Monday at 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  create_sprint_issue:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get last week's release info
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_PR=$(gh pr list \
            --base main \
            --head develop \
            --state merged \
            --limit 1 \
            --json number,title,createdAt \
            --jq '.[0] | if . == null then "（前週リリースなし）" else "\(.number): \(.title)" end')

          # Use date-only format (YYYY-MM-DD) required by GitHub search API
          WEEK_AGO=$(date -u -d '7 days ago' +'%Y-%m-%d' 2>/dev/null || date -u -v-7d +'%Y-%m-%d')
          MERGED_PRS=$(gh pr list \
            --base develop \
            --state merged \
            --search "merged:>=$WEEK_AGO" \
            --json number,title \
            --jq '.[] | "- #\(.number): \(.title)"' || echo "（先週マージされたPRなし）")

          DELIMITER="EOF_$(uuidgen | tr -d '-')"
          {
            echo "last_pr<<$DELIMITER"
            echo "$LAST_PR"
            echo "$DELIMITER"
            echo "merged_prs<<$DELIMITER"
            echo "$MERGED_PRS"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Get open feature requests
        id: open_issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_FEATURES=$(gh issue list \
            --label "enhancement" \
            --label "feature" \
            --state open \
            --limit 5 \
            --json number,title,labels \
            --jq '.[] | "- #\(.number): \(.title)"' || echo "（対象Issueなし）")

          DELIMITER="EOF_$(uuidgen | tr -d '-')"
          {
            echo "features<<$DELIMITER"
            echo "$OPEN_FEATURES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create Sprint Planning Issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Tokyo
          LAST_PR: ${{ steps.release_info.outputs.last_pr }}
          MERGED_PRS: ${{ steps.release_info.outputs.merged_prs }}
          OPEN_FEATURES: ${{ steps.open_issues.outputs.features }}
        run: |
          WEEK_NUM=$(date +'Week %V')
          SPRINT_TITLE="Sprint Planning - $(date +'%Y/%m/%d') ($WEEK_NUM)"

          {
            echo "## 📋 Sprint Overview"
            echo ""
            echo "**Sprint Goal**: Deliver value through planned feature development and bug fixes"
            echo ""
            echo "### 📊 Previous Week Summary"
            echo ""
            echo "**Last Released**:"
            echo "$LAST_PR"
            echo ""
            echo "**Merged PRs this past week**:"
            echo "$MERGED_PRS"
            echo ""
            echo "### 🎯 Candidates for This Week"
            echo ""
            echo "**Open Feature Requests**:"
            echo "$OPEN_FEATURES"
            echo ""
            echo "### 📝 Planning Tasks"
            echo ""
            echo "- [ ] **Review** Claude's proposals below and select features for this sprint"
            echo "- [ ] **Assign** tasks to developers"
            echo "- [ ] **Comment** with approved sprint scope: \`@claude implement\`"
            echo ""
            echo "### 💬 Next Steps"
            echo ""
            echo "Once you've finalized the scope, mention \`@claude\` in a comment:"
            echo '```'
            echo "@claude implement"
            echo "Please implement the following features:"
            echo "1. Feature A"
            echo "2. Feature B"
            echo '```'
          } > /tmp/issue_body.md

          ISSUE_URL=$(gh issue create \
            --title "$SPRINT_TITLE" \
            --body-file /tmp/issue_body.md \
            --label "sprint-planning,sprint")
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -o '[0-9]*$')
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

  claude_proposals:
    needs: create_sprint_issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh issue comment:*),Bash(gh issue list:*),Bash(gh issue view:*),WebSearch,WebFetch"'
          prompt: |
            You are a product strategist for **Makasete AI** — a spreadsheet-driven AI chatbot
            for Japanese e-commerce and service sites, featuring real-time voice interaction
            and low-latency streaming TTS.

            ## Phase 1: Competitive & Market Research

            Search the web and gather insights on the following:

            1. **Competitor products** — Search for AI chatbot / voice assistant solutions
               targeting Japanese e-commerce (keywords: 'ECサイト AIチャットボット', 'AI voice
               assistant ecommerce Japan', 'shopify chatbot AI Japan 2025'). For each
               competitor found, note: key features, pricing model, and gaps.

            2. **Market trends** — Search for recent trends in conversational AI and voice
               commerce (keywords: 'voice commerce trends 2025', 'AI chatbot ecommerce
               conversion rate', 'LLM customer support SaaS 2025'). Identify 2-3 trends
               most relevant to Makasete AI.

            ## Phase 2: Feature Proposals

            Based on your research AND the open issues in this repository, propose 3-5 feature
            candidates for this week's sprint.

            For each proposal, provide:
            - **Feature name** (one line)
            - **Why now** — competitive gap, market trend, or user pain point driving it
            - **Scope estimate** — S / M / L (S = 1 day, M = 2-3 days, L = 4-5 days)
            - **Success metric** — how we know it worked

            Rank proposals by impact-to-effort ratio.

            ## Post Results

            Post your full analysis as a comment on GitHub issue #${{ needs.create_sprint_issue.outputs.issue_number }}
            by running:
              gh issue comment ${{ needs.create_sprint_issue.outputs.issue_number }} --body "<your analysis in Japanese>"
